services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    volumes: ["appdata:/data"]
    depends_on: [ollama]

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  ollama-pull:            # one-shot: downloads the model into the ollama volume
    image: ollama/ollama
    entrypoint: ["ollama", "pull", "llama3.2"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on: [ollama]
    restart: on-failure

volumes:
  appdata:
  ollama:
